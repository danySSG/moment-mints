name = "moment-claim"
main = "src/index.js"
compatibility_date = "2026-07-08"
workers_dev = true

# Non-secret config (safe to commit). Flip to production by changing these two:
#   CROSSMINT_BASE   -> https://www.crossmint.com   (needs a sk_production_ key)
#   SOLANA_CLUSTER   -> mainnet
[vars]
CROSSMINT_BASE = "https://staging.crossmint.com"
# "Moment Mints" Solana collection created on this Crossmint account (staging):
CROSSMINT_COLLECTION_ID = "00ca281f-0876-40d7-8e76-2c1b5c1ab130"
SOLANA_CLUSTER = "devnet"
ALLOWED_ORIGIN = "https://danyssg.github.io"

# Edition counters. Create once and paste the returned id:
#   npx wrangler kv namespace create EDITIONS
[[kv_namespaces]]
binding = "EDITIONS"
id = "344efed2b1ff4beda08c0b07fa0a2b3d"

# Secrets (DO NOT put here) — set with:
#   npx wrangler secret put CROSSMINT_KEY      (your sk_staging_ / sk_test_ server key)
#   npx wrangler secret put TURNSTILE_SECRET   (your Turnstile widget SECRET key)
